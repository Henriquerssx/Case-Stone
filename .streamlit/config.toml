# Identidade: o mundo do Clube dos Sonhos (fundo tinta, Outfit/Manrope, verde-água) com as cores do Impulso Stone.
# Fontes servidas do próprio projeto (demo/static/fonts, licença OFL): o painel funciona sem internet no pitch.

[browser]
gatherUsageStats = false

[server]
enableStaticServing = true

[client]
toolbarMode = "viewer"

[[theme.fontFaces]]
family = "Manrope"
url = "app/static/fonts/Manrope-variable-latin.woff2"
weight = "400 800"

[[theme.fontFaces]]
family = "Outfit"
url = "app/static/fonts/Outfit-variable-latin.woff2"
weight = "400 800"

[theme]
base = "dark"
font = "Manrope, sans-serif"
headingFont = "Outfit, sans-serif"
headingFontWeights = [800, 800, 700, 700, 700, 700]
baseRadius = "0.9rem"
buttonRadius = "full"
showWidgetBorder = true
primaryColor = "#32ADA1"            # verde-água (ações, como no Clube dos Sonhos)
backgroundColor = "#03211D"         # tinta
secondaryBackgroundColor = "#06352E"
textColor = "#E6EAE9"               # névoa
linkColor = "#32ADA1"               # verde-água (o limão fica só para o top 10%)
borderColor = "#0E4A40"
dataframeHeaderBackgroundColor = "#06352E"
# paleta validada (contraste ≥ 3:1 sobre a tinta, separação para daltonismo)
chartCategoricalColors = ["#2EA99C", "#9A78F0", "#7FCFC5", "#C7F93C"]
chartSequentialColors = ["#06352E", "#0B4A3C", "#0F5E45", "#14734D", "#1E8A55", "#3FAF55", "#6CC65A", "#97DB55", "#B8EC48", "#C7F93C"]
